      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sortinghat-static
  labels:
    app.kubernetes.io/name: grimoirelab
    app.kubernetes.io/component: sortinghat
spec:
