apiVersion: v1
kind: ConfigMap
metadata:
  name: grimoirelab-config
  labels:
    app.kubernetes.io/name: grimoirelab
data:
  setup.cfg: |-
    [general]
    short_name = GrimoireLab
    update = true
    min_update_delay = 60
    debug = false
    logs_dir = /home/grimoire/logs
    bulk_size = 100
    scroll_size = 100
    aliases_file = /home/grimoire/aliases.json

    [projects]
    projects_file = /home/grimoire/conf/projects.json

    [es_collection]
    url = https://admin:GrimoireLab.1@opensearch-node1:9200

    [es_enrichment]
    url = https://admin:GrimoireLab.1@opensearch-node1:9200
    autorefresh = true

    [sortinghat]
    host = grimoirelab-gateway
    user = admin
    password = admin
    port = 80
    path = /identities/api/
    ssl = false
    database = sortinghat_db
    autoprofile = [github, git]
    matching = [email,name,username]
    sleep_for = 100
    unaffiliated_group = Unknown
    affiliate = true

    [panels]
    kibiter_time_from =
    kibiter_default_index =
    kibiter_url =
    kibiter_version =

    [phases]
    collection = true
    identities = true
    enrichment = true
    panels = false

    [git]
    raw_index = git_raw
    enriched_index = git_enriched
    latest-items = true
    studies = [enrich_demography:git, enrich_areas_of_code:git, enrich_onion:git]

    [github]
    api-token = 
    raw_index = github_raw
    sleep-for-rate = true
    sleep-time = "30"
    enriched_index = github_enriched

    [enrich_demography:git]

    [enrich_areas_of_code:git]
    in_index = git_raw
    out_index = git-aoc_enriched

    [enrich_onion:git]
    in_index = git
    out_index = git-onion_enriched
    contribs_field = hash

  projects.json: |-
    {
        "Example": {
          "git": [
            "https://github.com/example/example.git"
          ],
          "github": [
            "https://github.com/example/example"
          ]
         }
      }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grimoirelab-nginx-templates
  labels:
    app.kubernetes.io/name: grimoirelab
data:
  nginx.conf.template: |-

    upstream sortinghat {
      server sortinghat:9314;
    }
    server {
      include    mime.types;
      sendfile on;
      listen 80;
      listen 443 ssl;
      ssl_certificate /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;

      server_name localhost nginx;

      location / {
          proxy_pass ${KIBANA_HOST};
          proxy_redirect ${KIBANA_HOST} /;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection 'upgrade';
          proxy_set_header Host $host;
          proxy_cache_bypass $http_upgrade;
      }

      location /identities {
          rewrite ^/identities/(.*) /$1 break;

          include /etc/nginx/uwsgi_params;
          uwsgi_pass sortinghat;
          uwsgi_param Host $host;
          uwsgi_param X-Real-IP $remote_addr;
          uwsgi_param X-Forwarded-For $proxy_add_x_forwarded_for;
          uwsgi_param X-Forwarded-Proto $http_x_forwarded_proto;
      }

      location ~ ^/identities/(css|js|fonts)/ {
        rewrite ^/identities/(.*) /$1 break;

        root /sortinghat;
      }
    }
  uwsgi_params: |-
    uwsgi_param QUERY_STRING $query_string;
    uwsgi_param REQUEST_METHOD $request_method;
    uwsgi_param CONTENT_TYPE $content_type;
    uwsgi_param CONTENT_LENGTH $content_length;
    uwsgi_param REQUEST_URI $request_uri;
    uwsgi_param PATH_INFO $document_uri;
    uwsgi_param DOCUMENT_ROOT $document_root;
    uwsgi_param SERVER_PROTOCOL $server_protocol;
    uwsgi_param HTTPS $https if_not_empty;
    uwsgi_param REMOTE_ADDR $remote_addr;
    uwsgi_param REMOTE_PORT $remote_port;
    uwsgi_param SERVER_PORT $server_port;
    uwsgi_param SERVER_NAME $server_name;

