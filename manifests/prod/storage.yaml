apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-data
  namespace: grimoirelab
  labels:
    app.kubernetes.io/name: grimoirelab
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-premium  # Azure Premium SSD for RWO volumes
  resources:
    requests:
      storage: 20Gi
---
