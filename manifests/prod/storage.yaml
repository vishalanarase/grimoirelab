apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sortinghat-static
  namespace: grimoirelab
  labels:
    app.kubernetes.io/name: grimoirelab
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: azurefile-csi  # Azure File for RWX volumes (required for shared SortingHat static assets)
  resources:
    requests:
      storage: 1Gi

